[package]
name = "policy-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

# Sibling checkout of github.com/authdog/web-sdk. The crate is source-only
# and uses workspace inheritance, so it is not a crates.io dependency.
[dependencies]
authdog-axum = { path = "../../../web-sdk/packages/rust/axum" }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
